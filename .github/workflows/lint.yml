# when code change the linter will check format , syntax , inedentation (linting ) is correct or not
name: Auto Linter

on:
  push:
    paths: "*.py"
    
jobs:
  code:
    runs-on: ubuntu-latest
    #this step will automatically clone the code of the current branch into the runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v4
